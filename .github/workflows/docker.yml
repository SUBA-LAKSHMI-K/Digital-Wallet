name: Build and Push Docker Images

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # =========================
  # BACKEND
  # =========================
  build-backend:

    name: Build Backend Docker Image

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/digital-wallet-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/digital-wallet-backend:${{ github.sha }}


  # =========================
  # FRONTEND
  # =========================
  build-frontend:

    name: Build Frontend Docker Image

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/digital-wallet-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/digital-wallet-frontend:${{ github.sha }}


  # =========================
  # DATABASE
  # =========================
  build-database:

    name: Build Database Docker Image

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Database Image
        uses: docker/build-push-action@v6
        with:
          context: ./database
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/digital-wallet-database:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/digital-wallet-database:${{ github.sha }}