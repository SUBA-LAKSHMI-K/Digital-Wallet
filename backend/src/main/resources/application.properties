spring.application.name=digital-wallet
server.port=8080

# ---- MySQL (change username/password or set DB_USERNAME / DB_PASSWORD env variables) ----
spring.datasource.url=jdbc:mysql://localhost:3306/digital_wallet?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Root@12345

# The schema is created by database/*.sql, so Hibernate must NOT touch it
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- CORS (React dev server) ----
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# ---- Swagger / OpenAPI ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
